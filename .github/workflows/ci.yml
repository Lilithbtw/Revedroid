name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Check Kotlin style (pinterest/ktlint)
        run: ./gradlew ktlintCheck

  build:
    name: Android lint, tests & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload Android lint results to code scanning
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Android lint
        run: ./gradlew :app:lintGithubDebug
      - name: Upload Android lint results
        if: always() && hashFiles('app/build/reports/lint-results-githubDebug.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/lint-results-githubDebug.sarif
          category: android-lint
      - name: Unit tests
        run: ./gradlew :app:testGithubDebugUnitTest
      - name: Build debug APK
        run: ./gradlew :app:assembleGithubDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/github/debug/app-github-debug.apk

  fdroid:
    name: F-Droid build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Check for proprietary Google libraries
        run: |
          ./gradlew -q :app:dependencies --configuration fdroidReleaseRuntimeClasspath > fdroid-dependencies.txt
          if grep -E 'com\.google\.(android\.gms|android\.play|firebase|mlkit)|com\.android\.installreferrer' fdroid-dependencies.txt; then
            echo "::error::The F-Droid build depends on proprietary Google libraries"
            exit 1
          fi
      # Unsigned, like the APK F-Droid builds from source.
      - name: Build F-Droid release APK
        run: ./gradlew :app:assembleFdroidRelease
      - name: Check the APK doesn't install updates itself
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          if "$AAPT2" dump permissions app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk | grep REQUEST_INSTALL_PACKAGES; then
            echo "::error::The F-Droid APK requests REQUEST_INSTALL_PACKAGES"
            exit 1
          fi
