name: Release

# Push a tag like v0.2.0 to build a signed APK and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.REVEDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret REVEDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          REVEDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          REVEDROID_KEYSTORE_PASSWORD: ${{ secrets.REVEDROID_KEYSTORE_PASSWORD }}
          REVEDROID_KEY_ALIAS: ${{ secrets.REVEDROID_KEY_ALIAS }}
          REVEDROID_KEY_PASSWORD: ${{ secrets.REVEDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "revedroid-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: revedroid-${{ github.ref_name }}.apk
          generate_release_notes: true
