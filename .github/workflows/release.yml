name: Release

# Every push to main that passes CI and changes something other than Markdown creates
# the next patch tag (v0.1.0, v0.1.1, ...) and a GitHub release with a signed APK. The
# F-Droid build, which leaves out the in-app updater, gets its own release under a
# matching -fdroid tag (v0.1.1-fdroid).
# Pushing a tag like v0.2.0 by hand also builds and publishes that tag.
on:
  # Waits for CI, so a commit that fails lint or tests never reaches the in-app updater.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*", "!v*-fdroid"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Create the next version tag
    # Only CI runs for pushes to this repository's main, never for pull requests.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      # The commit CI tested, not whatever main points to by now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Work out the next patch version
        id: next
        run: |
          # The -fdroid tags share their version with the plain tag, so skip them.
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-fdroid$' | head -n 1)
          if [ -z "$latest" ]; then
            tag=v0.1.0
          # Nothing but Markdown changed since the last release (or it's already tagged).
          elif git diff --quiet "$latest" HEAD -- . ':!*.md'; then
            echo "No changes to release since $latest"
            exit 0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            tag=v$major.$minor.$((patch + 1))
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Push the tag
        if: steps.next.outputs.tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.next.outputs.tag }}" -m "Release ${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"

  release:
    name: Build and publish the signed APKs
    needs: tag
    # A new tag from the tag job, or a tag pushed by hand.
    if: always() && (needs.tag.outputs.tag != '' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag || github.ref_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.REVEDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret REVEDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APKs
        env:
          REVEDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          REVEDROID_KEYSTORE_PASSWORD: ${{ secrets.REVEDROID_KEYSTORE_PASSWORD }}
          REVEDROID_KEY_ALIAS: ${{ secrets.REVEDROID_KEY_ALIAS }}
          REVEDROID_KEY_PASSWORD: ${{ secrets.REVEDROID_KEY_PASSWORD }}
          TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
        # The tag sets versionName and versionCode, so each release upgrades the last.
        run: ./gradlew :app:assembleGithubRelease :app:assembleFdroidRelease -PrevedroidVersion="${TAG#v}"
      - name: Verify signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/github/release/app-github-release.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
      # CI checks an unsigned build of the same commit, but a tag pushed by hand skips CI,
      # so check the APK that actually ships before publishing anything.
      - name: Check the F-Droid build
        run: |
          ./gradlew -q :app:dependencies --configuration fdroidReleaseRuntimeClasspath > fdroid-dependencies.txt
          if grep -E 'com\.google\.(android\.gms|android\.play|firebase|mlkit)|com\.android\.installreferrer' fdroid-dependencies.txt; then
            echo "::error::The F-Droid build depends on proprietary Google libraries"
            exit 1
          fi
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          if "$AAPT2" dump permissions app/build/outputs/apk/fdroid/release/app-fdroid-release.apk | grep REQUEST_INSTALL_PACKAGES; then
            echo "::error::The F-Droid APK requests REQUEST_INSTALL_PACKAGES"
            exit 1
          fi
      - name: Rename APKs
        env:
          TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
        run: |
          mv app/build/outputs/apk/github/release/app-github-release.apk "revedroid-$TAG.apk"
          mv app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "revedroid-$TAG-fdroid.apk"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag || github.ref_name }}
          files: revedroid-${{ needs.tag.outputs.tag || github.ref_name }}.apk
          generate_release_notes: true
      - name: Push the F-Droid tag
        env:
          TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
        # A re-run finds the tag already pushed.
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG-fdroid" > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG-fdroid" -m "F-Droid build of $TAG"
            git push origin "$TAG-fdroid"
          fi
      # Never the latest release: the in-app updater installs the latest release's APK,
      # and the F-Droid build can't update itself.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag || github.ref_name }}-fdroid
          name: ${{ needs.tag.outputs.tag || github.ref_name }} for F-Droid
          body: |
            The F-Droid build of [${{ needs.tag.outputs.tag || github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.tag.outputs.tag || github.ref_name }}): the same app without the in-app updater. Update it through F-Droid or by installing the next F-Droid APK.
          files: revedroid-${{ needs.tag.outputs.tag || github.ref_name }}-fdroid.apk
          make_latest: false
