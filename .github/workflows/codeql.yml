name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly, so new queries also run on unchanged code

permissions:
  contents: read

jobs:
  analyze:
    name: Security analysis (Kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      # CodeQL has to watch kotlinc run, so skip every cached or up-to-date output.
      - name: Build
        run: ./gradlew :app:assembleGithubDebug --no-build-cache --no-configuration-cache --rerun-tasks
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
